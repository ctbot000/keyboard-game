<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타자 연습 — 한글 두벌식 · 영문 QWERTY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230d1117'/><text x='32' y='45' font-size='38' text-anchor='middle' fill='%234dd6c1' font-family='sans-serif'>한</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar">
  <h1>타자 연습 <span class="sub" id="lang-badge">두벌식</span></h1>
  <div class="tools">
    <button id="btn-finger" class="tbtn" title="손가락 구역 색 표시">✋ 손가락</button>
    <button id="btn-sound" class="tbtn" title="소리 켜기/끄기">🔊</button>
    <button id="btn-menu" class="tbtn hidden">◀ 메뉴</button>
  </div>
</header>

<main>

  <!-- ─────────────────────────────── 메뉴 ─────────────────────────────── -->
  <section id="screen-menu">
    <div id="langsel">
      <button class="langbtn active" data-lang="ko">한글 두벌식</button>
      <button class="langbtn" data-lang="en">English QWERTY</button>
    </div>
    <p class="lead" id="lead"></p>
    <div id="modes"></div>
    <p class="foot">Esc — 그만두기 · Backspace — 지우기</p>
  </section>

  <!-- ─────────────────────────────── 연습 ─────────────────────────────── -->
  <section id="screen-play" class="hidden">
    <div class="hud">
      <div class="hud-left">
        <div id="play-mode" class="hud-mode"></div>
        <div id="play-hint" class="hud-hint"></div>
      </div>
      <div class="hud-right">
        <div class="stat"><b id="progress">–</b><span>진행</span></div>
        <div class="stat"><b id="stat-speed">0</b><span id="stat-speed-unit">타/분</span></div>
        <div class="stat"><b id="stat-acc">100%</b><span>정확도</span></div>
        <div class="stat"><b id="stat-time">0:00</b><span>시간</span></div>
      </div>
    </div>

    <!-- 자리 / 낱말 / 문장 -->
    <div id="field-practice" class="field">
      <div id="target"></div>
      <div id="typed"></div>
      <div id="upcoming"></div>
    </div>

    <!-- 낱말 떨어뜨리기 -->
    <div id="field-fall" class="field hidden">
      <div id="fall-hud">
        <span>점수 <b id="fall-score">0</b></span>
        <span>레벨 <b id="fall-level">1</b></span>
        <span class="lives"><b id="fall-lives">♥♥♥</b></span>
      </div>
      <div id="fall-field">
        <div id="fall-words"></div>
        <div id="level-up"></div>
      </div>
      <div id="fall-buf"></div>
    </div>

    <div id="keyboard"></div>
  </section>

  <!-- ─────────────────────────────── 결과 ─────────────────────────────── -->
  <section id="screen-result" class="hidden">
    <h2 id="result-title"></h2>
    <div id="result-grid"></div>
    <p id="result-note"></p>
    <div class="actions">
      <button id="btn-again" class="primary">다시 하기</button>
      <button id="btn-back">메뉴로</button>
    </div>
  </section>

</main>

<script src="js/hangul.js"></script>
<script src="js/data.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/game.js"></script>
</body>
</html>
